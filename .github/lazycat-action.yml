version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/suwayomi.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: suwayomi
build:
  run_buildscript: false
images:
  # 主应用：上游 tag 家族 v<major>.<minor>.<build>（v1.1.1719~v2.1.1999），排除 latest/stable/preview 与 -r 后缀旧 tag
  - id: suwayomi
    target: service
    service: suwayomi
    source: ghcr.io/suwayomi/suwayomi-server
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
  # 辅助 flaresolverr（byparr）不注册：上游只有 mutable tag（latest/main/nightly，无 immutable 家族），
  # 而 bump:patch 仅适用于 version_source 镜像；若注册会被以非 mutable 路径重写 manifest 并剥掉
  # digest-pin（裸 latest 会 CONFIG_INVALID）。保持 manifest 中 digest-pinned 静态引用即可。

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Suwayomi
    summary: "开源漫画阅读器"
